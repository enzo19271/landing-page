<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input[type="password"],
    input[type="text"],
    input[type="url"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="password"]:focus,
    input[type="text"]:focus,
    input[type="url"]:focus,
    input[type="number"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.95em;
    }

    .alert-error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .alert-success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
      background: #f5f5f5;
    }

    .dashboard-header {
      background: white;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-header h1 {
      font-size: 1.8em;
    }

    .logout-btn {
      background: #dc3545;
      padding: 8px 20px;
      font-size: 0.9em;
      width: auto;
    }

    .logout-btn:hover {
      background: #c82333;
    }

    .dashboard-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section h2 {
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .tags-input {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag-item {
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9em;
    }

    .tag-item button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2em;
      padding: 0;
      width: auto;
    }

    .works-list {
      margin-top: 30px;
    }

    .work-item {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 20px;
    }

    .work-info {
      flex: 1;
    }

    .work-title {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .work-category {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 8px;
    }

    .work-description {
      font-size: 0.95em;
      color: #555;
      line-height: 1.4;
    }

    .work-actions {
      display: flex;
      gap: 10px;
    }

    .edit-btn, .delete-btn {
      padding: 8px 16px;
      font-size: 0.9em;
      width: auto;
    }

    .edit-btn {
      background: #667eea;
    }

    .delete-btn {
      background: #dc3545;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.4em;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      color: #999;
      width: auto;
      padding: 0;
    }

    .close-btn:hover {
      color: #333;
    }

    .submit-btn {
      width: 100%;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .work-item {
        flex-direction: column;
      }

      .work-actions {
        width: 100%;
      }

      .edit-btn, .delete-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN VIEW -->
  <div id="loginView" class="login-container">
    <div class="login-box">
      <h2>Admin Login</h2>
      <div id="loginError"></div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
      </div>
      <button onclick="handleLogin()">Login</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" class="dashboard">
    <div class="dashboard-header">
      <h1>Admin Dashboard</h1>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <div class="dashboard-content">
      <!-- FORM TAMBAH/EDIT WORK -->
      <div class="section">
        <h2>Tambah Karya Baru</h2>
        <div id="formError"></div>
        
        <div class="form-group">
          <label for="title">Judul Proyek</label>
          <input type="text" id="title" placeholder="Nama proyek">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Kategori</label>
            <input type="text" id="category" placeholder="Web, Mobile, Design">
          </div>
          <div class="form-group">
            <label for="emoji">Emoji</label>
            <input type="text" id="emoji" placeholder="📁 🎨 💻" maxlength="2">
          </div>
        </div>

        <div class="form-group full">
          <label for="description">Deskripsi</label>
          <textarea id="description" placeholder="Jelaskan tentang proyek ini..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="image">URL Gambar</label>
            <input type="url" id="image" placeholder="https://example.com/image.jpg">
          </div>
          <div class="form-group">
            <label for="link">Link Proyek</label>
            <input type="url" id="link" placeholder="https://example.com">
          </div>
        </div>

        <div class="form-group full">
          <label for="tagInput">Tags (pisahkan dengan enter)</label>
          <input type="text" id="tagInput" placeholder="Ketik tag dan tekan Enter">
          <div class="tags-input" id="tagsList"></div>
        </div>

        <button class="submit-btn" onclick="handleSaveWork()">
          <span id="submitBtnText">Tambah Karya</span>
        </button>
      </div>

      <!-- DAFTAR WORK -->
      <div class="section">
        <h2>Daftar Karya</h2>
        <div id="worksList" class="works-list"></div>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Karya</h3>
        <button class="close-btn" onclick="closeEditModal()">×</button>
      </div>
      <div id="editFormError"></div>
      
      <div class="form-group">
        <label for="editTitle">Judul Proyek</label>
        <input type="text" id="editTitle" placeholder="Nama proyek">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="editCategory">Kategori</label>
          <input type="text" id="editCategory" placeholder="Web, Mobile, Design">
        </div>
        <div class="form-group">
          <label for="editEmoji">Emoji</label>
          <input type="text" id="editEmoji" placeholder="📁 🎨 💻" maxlength="2">
        </div>
      </div>

      <div class="form-group full">
        <label for="editDescription">Deskripsi</label>
        <textarea id="editDescription" placeholder="Jelaskan tentang proyek ini..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="editImage">URL Gambar</label>
          <input type="url" id="editImage" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label for="editLink">Link Proyek</label>
          <input type="url" id="editLink" placeholder="https://example.com">
        </div>
      </div>

      <div class="form-group full">
        <label for="editTagInput">Tags</label>
        <input type="text" id="editTagInput" placeholder="Ketik tag dan tekan Enter">
        <div class="tags-input" id="editTagsList"></div>
      </div>

      <button class="submit-btn" onclick="handleUpdateWork()" style="margin-top: 20px;">
        Update Karya
      </button>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let token = localStorage.getItem('adminToken');
    let currentTags = [];
    let editingWorkId = null;
    let editingTags = [];

    // ─── INIT ───────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      if (token) {
        verifyToken();
      } else {
        showLoginView();
      }

      // Tag input handlers
      document.getElementById('tagInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTag(document.getElementById('tagInput').value);
          document.getElementById('tagInput').value = '';
        }
      });

      document.getElementById('editTagInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addEditTag(document.getElementById('editTagInput').value);
          document.getElementById('editTagInput').value = '';
        }
      });
    });

    // ─── AUTH ───────────────────────────────────────────────────────────
    async function handleLogin() {
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.innerHTML = '';

      if (!password) {
        errorDiv.innerHTML = '<div class="alert alert-error">Password tidak boleh kosong</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();
        if (!response.ok) {
          errorDiv.innerHTML = '<div class="alert alert-error">' + data.message + '</div>';
          return;
        }

        token = data.token;
        localStorage.setItem('adminToken', token);
        showDashboard();
      } catch (err) {
        errorDiv.innerHTML = '<div class="alert alert-error">Login gagal: ' + err.message + '</div>';
      }
    }

    async function verifyToken() {
      try {
        const response = await fetch(`${API_BASE}/admin/verify`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          localStorage.removeItem('adminToken');
          showLoginView();
          return;
        }

        showDashboard();
      } catch (err) {
        localStorage.removeItem('adminToken');
        showLoginView();
      }
    }

    function handleLogout() {
      localStorage.removeItem('adminToken');
      token = null;
      currentTags = [];
      showLoginView();
    }

    // ─── VIEWS ──────────────────────────────────────────────────────────
    function showLoginView() {
      document.getElementById('loginView').style.display = 'flex';
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('password').focus();
    }

    function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      loadPortfolio();
    }

    // ─── TAGS ───────────────────────────────────────────────────────────
    function addTag(tag) {
      if (tag.trim() && !currentTags.includes(tag.trim())) {
        currentTags.push(tag.trim());
        renderTags();
      }
    }

    function removeTag(index) {
      currentTags.splice(index, 1);
      renderTags();
    }

    function renderTags() {
      const container = document.getElementById('tagsList');
      container.innerHTML = currentTags.map((tag, i) => `
        <div class="tag-item">
          ${tag}
          <button onclick="removeTag(${i})">×</button>
        </div>
      `).join('');
    }

    function addEditTag(tag) {
      if (tag.trim() && !editingTags.includes(tag.trim())) {
        editingTags.push(tag.trim());
        renderEditTags();
      }
    }

    function removeEditTag(index) {
      editingTags.splice(index, 1);
      renderEditTags();
    }

    function renderEditTags() {
      const container = document.getElementById('editTagsList');
      container.innerHTML = editingTags.map((tag, i) => `
        <div class="tag-item">
          ${tag}
          <button onclick="removeEditTag(${i})">×</button>
        </div>
      `).join('');
    }

    // ─── PORTFOLIO ──────────────────────────────────────────────────────
    async function loadPortfolio() {
      try {
        const response = await fetch(`${API_BASE}/admin/portfolio`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const list = document.getElementById('worksList');

        if (!data.works || data.works.length === 0) {
          list.innerHTML = '<p style="text-align: center; color: #999;">Belum ada karya</p>';
          return;
        }

        list.innerHTML = data.works.map(work => `
          <div class="work-item">
            <div class="work-info">
              <div class="work-title">${work.title}</div>
              <div class="work-category">${work.category}</div>
              <div class="work-description">${work.description}</div>
            </div>
            <div class="work-actions">
              <button class="edit-btn" onclick="openEditModal('${work.id}', ${JSON.stringify(work).replace(/'/g, "&apos;")})">Edit</button>
              <button class="delete-btn" onclick="deleteWork('${work.id}')">Hapus</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading portfolio:', err);
      }
    }

    async function handleSaveWork() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const image = document.getElementById('image').value;
      const link = document.getElementById('link').value;
      const emoji = document.getElementById('emoji').value;
      const errorDiv = document.getElementById('formError');
      errorDiv.innerHTML = '';

      if (!title) {
        errorDiv.innerHTML = '<div class="alert alert-error">Judul tidak boleh kosong</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/admin/work`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            title,
            category: category || 'Project',
            description,
            image: image || '',
            link: link || '',
            emoji: emoji || '📁',
            tags: currentTags
          })
        });

        if (!response.ok) {
          const err = await response.json();
          errorDiv.innerHTML = '<div class="alert alert-error">' + err.message + '</div>';
          return;
        }

        errorDiv.innerHTML = '<div class="alert alert-success">Karya berhasil ditambahkan!</div>';
        
        // Reset form
        document.getElementById('title').value = '';
        document.getElementById('category').value = '';
        document.getElementById('description').value = '';
        document.getElementById('image').value = '';
        document.getElementById('link').value = '';
        document.getElementById('emoji').value = '';
        currentTags = [];
        renderTags();

        // Reload list
        setTimeout(() => {
          loadPortfolio();
          errorDiv.innerHTML = '';
        }, 1500);
      } catch (err) {
        errorDiv.innerHTML = '<div class="alert alert-error">Error: ' + err.message + '</div>';
      }
    }

    function openEditModal(id, work) {
      editingWorkId = id;
      editingTags = work.tags || [];

      document.getElementById('editTitle').value = work.title;
      document.getElementById('editCategory').value = work.category;
      document.getElementById('editDescription').value = work.description;
      document.getElementById('editImage').value = work.image;
      document.getElementById('editLink').value = work.link;
      document.getElementById('editEmoji').value = work.emoji;
      
      renderEditTags();
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
      editingWorkId = null;
      editingTags = [];
    }

    async function handleUpdateWork() {
      const title = document.getElementById('editTitle').value;
      const category = document.getElementById('editCategory').value;
      const description = document.getElementById('editDescription').value;
      const image = document.getElementById('editImage').value;
      const link = document.getElementById('editLink').value;
      const emoji = document.getElementById('editEmoji').value;
      const errorDiv = document.getElementById('editFormError');
      errorDiv.innerHTML = '';

      if (!title) {
        errorDiv.innerHTML = '<div class="alert alert-error">Judul tidak boleh kosong</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/admin/work/${editingWorkId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            title,
            category: category || 'Project',
            description,
            image: image || '',
            link: link || '',
            emoji: emoji || '📁',
            tags: editingTags
          })
        });

        if (!response.ok) {
          const err = await response.json();
          errorDiv.innerHTML = '<div class="alert alert-error">' + err.message + '</div>';
          return;
        }

        closeEditModal();
        loadPortfolio();
      } catch (err) {
        errorDiv.innerHTML = '<div class="alert alert-error">Error: ' + err.message + '</div>';
      }
    }

    async function deleteWork(id) {
      if (!confirm('Yakin ingin menghapus karya ini?')) return;

      try {
        const response = await fetch(`${API_BASE}/admin/work/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          alert('Error menghapus karya');
          return;
        }

        loadPortfolio();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
