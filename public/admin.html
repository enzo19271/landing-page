<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - CV & Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 { text-align: center; margin-bottom: 30px; }

    .form-group { margin-bottom: 20px; }

    label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }

    input[type="password"], input[type="text"], input[type="url"], input[type="number"],
    input[type="email"], input[type="tel"], input[type="file"],
    textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea { resize: vertical; min-height: 100px; }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
    button:active { transform: translateY(0); }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.95em; }
    .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }
    .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }

    .dashboard { display: none; min-height: 100vh; background: #f5f5f5; }

    .dashboard-header {
      background: white;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .dashboard-header h1 { font-size: 1.5em; }

    .logout-btn { background: #dc3545; padding: 8px 20px; font-size: 0.9em; width: auto; }
    .logout-btn:hover { background: #c82333; }

    .tab-nav {
      background: white;
      display: flex;
      gap: 4px;
      padding: 0 20px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .tab-btn {
      width: auto;
      background: none;
      color: #666;
      border-radius: 0;
      padding: 14px 18px;
      font-weight: 500;
      font-size: 0.92em;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      box-shadow: none;
    }

    .tab-btn:hover { transform: none; box-shadow: none; color: #667eea; background: #f9f9ff; }

    .tab-btn.active { color: #667eea; border-bottom: 3px solid #667eea; background: #f9f9ff; }

    .dashboard-content { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section h2 {
      margin-bottom: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
      font-size: 1.25em;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-row.full { grid-template-columns: 1fr; }

    .tags-input { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .tag-item {
      background: #667eea; color: white; padding: 6px 12px; border-radius: 20px;
      display: flex; align-items: center; gap: 8px; font-size: 0.9em;
    }

    .tag-item button { background: none; border: none; color: white; cursor: pointer; font-size: 1.2em; padding: 0; width: auto; }

    /* PHOTO PREVIEW */
    .photo-preview-row { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }

    .photo-preview {
      width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
      background: #eee; border: 2px solid #ddd; flex-shrink: 0;
    }

    .photo-preview-placeholder {
      width: 100px; height: 100px; border-radius: 50%; background: #eee;
      display: flex; align-items: center; justify-content: center; font-size: 2em; flex-shrink: 0;
    }

    /* SKILLS EDITOR */
    .skill-row {
      display: grid;
      grid-template-columns: 1fr 100px auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .skill-row input[type="number"] { width: 100%; }
    .skill-row button { width: auto; padding: 8px 14px; background: #dc3545; }
    .skill-row button:hover { background: #c82333; }

    .add-skill-row { display: grid; grid-template-columns: 1fr 100px auto; gap: 10px; margin-top: 15px; }
    .add-skill-row button { width: auto; padding: 10px 16px; }

    /* CERTIFICATES */
    .cert-admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .cert-admin-item { position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .cert-admin-item img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .cert-admin-caption { padding: 8px; font-size: 0.8em; color: #555; background: #f9f9f9; }

    .cert-admin-delete {
      position: absolute; top: 6px; right: 6px; width: auto; padding: 4px 9px;
      background: rgba(220,53,69,0.9); font-size: 0.85em; border-radius: 50%;
    }

    /* LISTS */
    .item-list { margin-top: 30px; }

    .list-item {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .list-item-info { flex: 1; min-width: 200px; }
    .list-item-title { font-size: 1.1em; font-weight: 600; margin-bottom: 5px; }
    .list-item-meta { font-size: 0.9em; color: #666; margin-bottom: 8px; }
    .list-item-desc { font-size: 0.95em; color: #555; line-height: 1.4; }
    .list-item-actions { display: flex; gap: 10px; }

    .edit-btn, .delete-btn { padding: 8px 16px; font-size: 0.9em; width: auto; }
    .edit-btn { background: #667eea; }
    .delete-btn { background: #dc3545; }
    .delete-btn:hover { background: #c82333; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }

    .modal-content {
      background: white; padding: 30px; border-radius: 12px; max-width: 550px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { font-size: 1.3em; }

    .close-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; color: #999; width: auto; padding: 0; }
    .close-btn:hover { color: #333; }

    .submit-btn { width: 100%; margin-top: 10px; }

    .spinner {
      border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%;
      width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .hint { font-size: 0.82em; color: #888; margin-top: -12px; margin-bottom: 16px; }

    @media (max-width: 768px) {
      .form-row, .skill-row, .add-skill-row { grid-template-columns: 1fr; }
      .list-item { flex-direction: column; }
      .list-item-actions { width: 100%; }
      .edit-btn, .delete-btn { flex: 1; }
    }
  </style>
</head>
<body>
  <!-- LOGIN VIEW -->
  <div id="loginView" class="login-container">
    <div class="login-box">
      <h2>Admin Login</h2>
      <div id="loginError"></div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
      </div>
      <button onclick="handleLogin()">Login</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" class="dashboard">
    <div class="dashboard-header">
      <h1>Admin Dashboard</h1>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('profile')">👤 Profil & Skill</button>
      <button class="tab-btn" onclick="switchTab('experience')">🧭 Pengalaman</button>
      <button class="tab-btn" onclick="switchTab('certificates')">🏆 Sertifikat</button>
      <button class="tab-btn" onclick="switchTab('news')">📰 Berita</button>
      <button class="tab-btn" onclick="switchTab('portfolio')">💼 Portfolio</button>
    </div>

    <div class="dashboard-content">

      <!-- ═══ TAB: PROFILE & SKILLS ═══ -->
      <div id="tab-profile" class="tab-panel active">
        <div class="section">
          <h2>Profil</h2>
          <div id="profileFormError"></div>

          <div class="photo-preview-row">
            <div id="profilePhotoPreviewWrap"><div class="photo-preview-placeholder">🙂</div></div>
            <div style="flex:1;">
              <label for="profilePhotoInput">Foto Profil</label>
              <input type="file" id="profilePhotoInput" accept="image/*" onchange="handleProfilePhotoChange(event)">
              <p class="hint">Otomatis dikompres sebelum disimpan.</p>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="pName">Nama</label>
              <input type="text" id="pName" placeholder="Nama lengkap">
            </div>
            <div class="form-group">
              <label for="pTitle">Gelar / Tagline</label>
              <input type="text" id="pTitle" placeholder="Web Developer & Creative">
            </div>
          </div>

          <div class="form-group full">
            <label for="pBio">Bio</label>
            <textarea id="pBio" placeholder="Ceritakan tentang dirimu..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="pEmail">Email</label>
              <input type="email" id="pEmail" placeholder="nama@email.com">
            </div>
            <div class="form-group">
              <label for="pPhone">Telepon</label>
              <input type="tel" id="pPhone" placeholder="08xxxxxxxxxx">
            </div>
          </div>

          <div class="form-group full">
            <label for="pLocation">Lokasi</label>
            <input type="text" id="pLocation" placeholder="Kota, Provinsi">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="pInstagram">Instagram URL</label>
              <input type="url" id="pInstagram" placeholder="https://instagram.com/username">
            </div>
            <div class="form-group">
              <label for="pTiktok">TikTok URL</label>
              <input type="url" id="pTiktok" placeholder="https://tiktok.com/@username">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="pGithub">GitHub URL</label>
              <input type="url" id="pGithub" placeholder="https://github.com/username">
            </div>
            <div class="form-group">
              <label for="pLinkedin">LinkedIn URL</label>
              <input type="url" id="pLinkedin" placeholder="https://linkedin.com/in/username">
            </div>
          </div>

          <button class="submit-btn" onclick="saveProfile()">Simpan Profil</button>
        </div>

        <div class="section">
          <h2>Skill</h2>
          <div id="skillsList"></div>
          <div class="add-skill-row">
            <input type="text" id="newSkillName" placeholder="Nama skill (mis. Web Development)">
            <input type="number" id="newSkillLevel" placeholder="Level %" min="0" max="100" value="80">
            <button onclick="addSkill()">+ Tambah</button>
          </div>
          <button class="submit-btn" style="margin-top:20px;" onclick="saveProfile()">Simpan Skill</button>
        </div>
      </div>

      <!-- ═══ TAB: EXPERIENCE ═══ -->
      <div id="tab-experience" class="tab-panel">
        <div class="section">
          <h2>Tambah Pengalaman</h2>
          <div id="expFormError"></div>

          <div class="form-row">
            <div class="form-group">
              <label for="expType">Jenis</label>
              <select id="expType">
                <option value="kerja">Pengalaman Kerja</option>
                <option value="organisasi">Pengalaman Organisasi</option>
              </select>
            </div>
            <div class="form-group">
              <label for="expPosition">Posisi / Jabatan</label>
              <input type="text" id="expPosition" placeholder="Sekretaris, Staff IT, dll.">
            </div>
          </div>

          <div class="form-group full">
            <label for="expOrganization">Nama Instansi / Organisasi</label>
            <input type="text" id="expOrganization" placeholder="BUMDES, Unmuh Babel, dll.">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expStartDate">Mulai</label>
              <input type="text" id="expStartDate" placeholder="mis. Jan 2023">
            </div>
            <div class="form-group">
              <label for="expEndDate">Selesai</label>
              <input type="text" id="expEndDate" placeholder="mis. Des 2024">
            </div>
          </div>

          <div class="form-group full" style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="expCurrent" style="width:auto;" onchange="document.getElementById('expEndDate').disabled = this.checked">
            <label for="expCurrent" style="margin:0;">Masih berlangsung sampai sekarang</label>
          </div>

          <div class="form-group full">
            <label for="expDescription">Deskripsi</label>
            <textarea id="expDescription" placeholder="Jelaskan tanggung jawab/aktivitas..."></textarea>
          </div>

          <button class="submit-btn" onclick="handleSaveExperience()">
            <span id="expSubmitBtnText">Tambah Pengalaman</span>
          </button>
        </div>

        <div class="section">
          <h2>Daftar Pengalaman</h2>
          <div id="experienceListAdmin" class="item-list"></div>
        </div>
      </div>

      <!-- ═══ TAB: CERTIFICATES ═══ -->
      <div id="tab-certificates" class="tab-panel">
        <div class="section">
          <h2>Tambah Sertifikat</h2>
          <div id="certFormError"></div>

          <div class="form-group">
            <label for="certImageInput">Foto Sertifikat</label>
            <input type="file" id="certImageInput" accept="image/*" onchange="handleCertFileChange(event)">
            <p class="hint">Otomatis dikompres sebelum disimpan.</p>
          </div>
          <div id="certPreviewWrap"></div>

          <div class="form-group full">
            <label for="certTitle">Nama Sertifikat</label>
            <input type="text" id="certTitle" placeholder="mis. Sertifikat Pelatihan Web Development">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="certIssuer">Penerbit</label>
              <input type="text" id="certIssuer" placeholder="mis. Dicoding, Unmuh Babel">
            </div>
            <div class="form-group">
              <label for="certDate">Tanggal</label>
              <input type="text" id="certDate" placeholder="mis. Agustus 2025">
            </div>
          </div>

          <div class="form-group full">
            <label for="certUrl">Link Verifikasi (opsional)</label>
            <input type="url" id="certUrl" placeholder="https://verifikasi-sertifikat.com/id">
          </div>

          <button class="submit-btn" onclick="uploadCertificate()">Upload Sertifikat</button>
        </div>

        <div class="section">
          <h2>Daftar Sertifikat</h2>
          <div id="certAdminList"></div>
        </div>
      </div>

      <!-- ═══ TAB: NEWS ═══ -->
      <div id="tab-news" class="tab-panel">
        <div class="section">
          <h2>Tambah Berita</h2>
          <div id="newsFormError"></div>

          <div class="form-group full">
            <label for="newsTitle">Judul</label>
            <input type="text" id="newsTitle" placeholder="Judul berita">
          </div>

          <div class="form-group">
            <label for="newsImageInput">Foto (opsional)</label>
            <input type="file" id="newsImageInput" accept="image/*" onchange="handleNewsFileChange(event)">
          </div>
          <div id="newsPreviewWrap"></div>

          <div class="form-group full">
            <label for="newsSummary">Isi Singkat</label>
            <textarea id="newsSummary" placeholder="Ringkasan singkat berita..."></textarea>
          </div>

          <div class="form-group full">
            <label for="newsSourceUrl">Link Berita Asli (opsional)</label>
            <input type="url" id="newsSourceUrl" placeholder="https://sumberberita.com/artikel">
          </div>

          <div class="form-group full">
            <label for="newsContent">Isi Berita Lengkap (opsional, kalau tidak ada link asli)</label>
            <textarea id="newsContent" placeholder="Tulis isi berita lengkap di sini..." style="min-height:150px;"></textarea>
          </div>

          <button class="submit-btn" onclick="handleSaveNews()">
            <span id="newsSubmitBtnText">Tambah Berita</span>
          </button>
        </div>

        <div class="section">
          <h2>Daftar Berita</h2>
          <div id="newsListAdmin" class="item-list"></div>
        </div>
      </div>

      <!-- ═══ TAB: PORTFOLIO ═══ -->
      <div id="tab-portfolio" class="tab-panel">
        <div class="section">
          <h2>Tambah Karya Baru</h2>
          <div id="formError"></div>

          <div class="form-group">
            <label for="title">Judul Proyek</label>
            <input type="text" id="title" placeholder="Nama proyek">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Kategori</label>
              <input type="text" id="category" placeholder="Web, Mobile, Design">
            </div>
            <div class="form-group">
              <label for="emoji">Emoji</label>
              <input type="text" id="emoji" placeholder="📁 🎨 💻" maxlength="2">
            </div>
          </div>

          <div class="form-group full">
            <label for="description">Deskripsi</label>
            <textarea id="description" placeholder="Jelaskan tentang proyek ini..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="image">URL Gambar</label>
              <input type="url" id="image" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
              <label for="link">Link Proyek</label>
              <input type="url" id="link" placeholder="https://example.com">
            </div>
          </div>

          <div class="form-group full">
            <label for="tagInput">Tags (pisahkan dengan enter)</label>
            <input type="text" id="tagInput" placeholder="Ketik tag dan tekan Enter">
            <div class="tags-input" id="tagsList"></div>
          </div>

          <button class="submit-btn" onclick="handleSaveWork()">
            <span id="submitBtnText">Tambah Karya</span>
          </button>
        </div>

        <div class="section">
          <h2>Daftar Karya</h2>
          <div id="worksList" class="item-list"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- EDIT WORK MODAL -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Karya</h3>
        <button class="close-btn" onclick="closeEditModal()">×</button>
      </div>
      <div id="editFormError"></div>

      <div class="form-group">
        <label for="editTitle">Judul Proyek</label>
        <input type="text" id="editTitle" placeholder="Nama proyek">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="editCategory">Kategori</label>
          <input type="text" id="editCategory" placeholder="Web, Mobile, Design">
        </div>
        <div class="form-group">
          <label for="editEmoji">Emoji</label>
          <input type="text" id="editEmoji" placeholder="📁 🎨 💻" maxlength="2">
        </div>
      </div>

      <div class="form-group full">
        <label for="editDescription">Deskripsi</label>
        <textarea id="editDescription" placeholder="Jelaskan tentang proyek ini..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="editImage">URL Gambar</label>
          <input type="url" id="editImage" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label for="editLink">Link Proyek</label>
          <input type="url" id="editLink" placeholder="https://example.com">
        </div>
      </div>

      <div class="form-group full">
        <label for="editTagInput">Tags</label>
        <input type="text" id="editTagInput" placeholder="Ketik tag dan tekan Enter">
        <div class="tags-input" id="editTagsList"></div>
      </div>

      <button class="submit-btn" onclick="handleUpdateWork()">Update Karya</button>
    </div>
  </div>

  <!-- EDIT NEWS MODAL -->
  <div id="editNewsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Berita</h3>
        <button class="close-btn" onclick="closeEditNewsModal()">×</button>
      </div>
      <div id="editNewsFormError"></div>

      <div class="form-group full">
        <label for="editNewsTitle">Judul</label>
        <input type="text" id="editNewsTitle" placeholder="Judul berita">
      </div>

      <div class="form-group">
        <label for="editNewsImageInput">Ganti Foto (opsional)</label>
        <input type="file" id="editNewsImageInput" accept="image/*" onchange="handleEditNewsFileChange(event)">
      </div>
      <div id="editNewsPreviewWrap"></div>

      <div class="form-group full">
        <label for="editNewsSummary">Isi Singkat</label>
        <textarea id="editNewsSummary"></textarea>
      </div>

      <div class="form-group full">
        <label for="editNewsSourceUrl">Link Berita Asli (opsional)</label>
        <input type="url" id="editNewsSourceUrl" placeholder="https://sumberberita.com/artikel">
      </div>

      <div class="form-group full">
        <label for="editNewsContent">Isi Berita Lengkap (opsional)</label>
        <textarea id="editNewsContent" style="min-height:150px;"></textarea>
      </div>

      <button class="submit-btn" onclick="handleUpdateNews()">Update Berita</button>

    let currentTags = [];
    let editingWorkId = null;
    let editingTags = [];

    let profileData = { skills: [], socialLinks: {} };
    let newProfilePhoto = null;    // base64 pending upload
    let newCertImage = null;       // base64 pending upload
    let newNewsImage = null;       // base64 pending upload
    let editNewsImage = null;      // base64 pending upload (edit)
    let editingNewsId = null;

    // ─── INIT ───────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      if (token) {

        showLoginView();

      document.getElementById('tagInput')?.addEventListener('keypress', (e) => {

    // ─── AUTH ───────────────────────────────────────────────────────────
    async function handleLogin() {
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.innerHTML = '';

      if (!password) {
        errorDiv.innerHTML = '<div class="alert alert-error">Password tidak boleh kosong</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();
        if (!response.ok) {
          errorDiv.innerHTML = '<div class="alert alert-error">' + data.message + '</div>';
          return;
        }

        token = data.token;
        localStorage.setItem('adminToken', token);
        showDashboard();
      } catch (err) {
        errorDiv.innerHTML = '<div class="alert alert-error">Login gagal: ' + err.message + '</div>';

    async function verifyToken() {
      try {
        const response = await fetch(`${API_BASE}/admin/verify`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          localStorage.removeItem('adminToken');
          showLoginView();
          return;
        }

        showDashboard();

        localStorage.removeItem('adminToken');

    function handleLogout() {

      event.currentTarget.classList.add('active');

    // ─── IMAGE HELPERS ──────────────────────────────────────────────────
    function compressImage(file, maxDim = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxDim) {
              height = Math.round(height * (maxDim / width));
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round(width * (maxDim / height));
              height = maxDim;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ─── PROFILE & SKILLS ───────────────────────────────────────────────

      try {

        profileData.skills = profileData.skills || [];
        profileData.socialLinks = profileData.socialLinks || {};

        document.getElementById('pName').value = profileData.name || '';
        document.getElementById('pTitle').value = profileData.title || '';
        document.getElementById('pBio').value = profileData.bio || '';
        document.getElementById('pEmail').value = profileData.email || '';
        document.getElementById('pPhone').value = profileData.phone || '';

        document.getElementById('pTiktok').value = profileData.socialLinks.tiktok || '';

    function addSkill() {

      const levelInput = document.getElementById('newSkillLevel');

      profileData.skills.push({ name, level: parseInt(levelInput.value) || 80 });
      nameInput.value = '';
      levelInput.value = 80;
      renderSkills();

    function removeSkill(i) {

          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(payload)

      document.getElementById('editNewsSummary').value = item.summary || '';
      document.getElementById('editNewsSourceUrl').value = item.sourceUrl || '';

        sourceUrl: document.getElementById('editNewsSourceUrl').value,

      if (editNewsImage !== null) payload.image = editNewsImage;

          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },

        closeEditNewsModal();
        loadNewsAdmin();

        const res = await fetch(`${API_BASE}/admin/news/${id}`, {

          headers: { 'Authorization': `Bearer ${token}` }

        loadNewsAdmin();
      } catch (err) {
        alert('Error: ' + err.message);

    // ─── TAGS (Portfolio) ───────────────────────────────────────────────
    function addTag(tag) {
      if (tag.trim() && !currentTags.includes(tag.trim())) {
        currentTags.push(tag.trim());
        renderTags();
      }
    }

    function removeTag(index) {
      currentTags.splice(index, 1);
      renderTags();
    }

    function renderTags() {
      const container = document.getElementById('tagsList');
      container.innerHTML = currentTags.map((tag, i) => `
        <div class="tag-item">${tag}<button onclick="removeTag(${i})">×</button></div>
      `).join('');
    }

    function addEditTag(tag) {
      if (tag.trim() && !editingTags.includes(tag.trim())) {
        editingTags.push(tag.trim());
        renderEditTags();
      }
    }

    function removeEditTag(index) {
      editingTags.splice(index, 1);
      renderEditTags();
    }

    function renderEditTags() {
      const container = document.getElementById('editTagsList');
      container.innerHTML = editingTags.map((tag, i) => `
        <div class="tag-item">${tag}<button onclick="removeEditTag(${i})">×</button></div>
      `).join('');
    }

              <div class="list-item-title">${work.title}</div>
              <div class="list-item-meta">${work.category}</div>
              <div class="list-item-desc">${work.description}</div>

            <div class="list-item-actions">
              <button class="edit-btn" onclick="openEditModal('${work.id}', ${JSON.stringify(work).replace(/'/g, "&apos;")})">Edit</button>
              <button class="delete-btn" onclick="deleteWork('${work.id}')">Hapus</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading portfolio:', err);
      }

    async function handleSaveWork() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const image = document.getElementById('image').value;
      const link = document.getElementById('link').value;
      const emoji = document.getElementById('emoji').value;
      const errorDiv = document.getElementById('formError');
      errorDiv.innerHTML = '';

      if (!title) {
        errorDiv.innerHTML = '<div class="alert alert-error">Judul tidak boleh kosong</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/admin/work`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            title, category: category || 'Project', description,
            image: image || '', link: link || '', emoji: emoji || '📁', tags: currentTags
          })
        });

        if (!response.ok) {
          const err = await response.json();
          errorDiv.innerHTML = '<div class="alert alert-error">' + err.message + '</div>';
          return;
        }

        errorDiv.innerHTML = '<div class="alert alert-success">Karya berhasil ditambahkan!</div>';

        document.getElementById('title').value = '';
        document.getElementById('category').value = '';
        document.getElementById('description').value = '';
        document.getElementById('image').value = '';
        document.getElementById('link').value = '';
        document.getElementById('emoji').value = '';
        currentTags = [];
        renderTags();

        setTimeout(() => {
          loadPortfolio();
          errorDiv.innerHTML = '';
        }, 1500);
      } catch (err) {
        errorDiv.innerHTML = '<div class="alert alert-error">Error: ' + err.message + '</div>';
      }
    }

    function openEditModal(id, work) {
      editingWorkId = id;
      editingTags = work.tags || [];

      document.getElementById('editTitle').value = work.title;
      document.getElementById('editCategory').value = work.category;
      document.getElementById('editDescription').value = work.description;
      document.getElementById('editImage').value = work.image;
      document.getElementById('editLink').value = work.link;
      document.getElementById('editEmoji').value = work.emoji;

      renderEditTags();
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
      editingWorkId = null;
      editingTags = [];
    }

    async function handleUpdateWork() {
      const title = document.getElementById('editTitle').value;
      const category = document.getElementById('editCategory').value;
      const description = document.getElementById('editDescription').value;
      const image = document.getElementById('editImage').value;
      const link = document.getElementById('editLink').value;
      const emoji = document.getElementById('editEmoji').value;
      const errorDiv = document.getElementById('editFormError');
      errorDiv.innerHTML = '';

      if (!title) {
        errorDiv.innerHTML = '<div class="alert alert-error">Judul tidak boleh kosong</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/admin/work/${editingWorkId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            title, category: category || 'Project', description,
            image: image || '', link: link || '', emoji: emoji || '📁', tags: editingTags
          })
        });

        if (!response.ok) {
          const err = await response.json();
          errorDiv.innerHTML = '<div class="alert alert-error">' + err.message + '</div>';
          return;
        }

        closeEditModal();
        loadPortfolio();
      } catch (err) {
        errorDiv.innerHTML = '<div class="alert alert-error">Error: ' + err.message + '</div>';
      }
    }

    async function deleteWork(id) {
      if (!confirm('Yakin ingin menghapus karya ini?')) return;

      try {
        const response = await fetch(`${API_BASE}/admin/work/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) { alert('Error menghapus karya'); return; }
        loadPortfolio();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
