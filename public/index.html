<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV & Portfolio - Enzo Fahrezi</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-body: #09090b;
      --bg-card: #121215;
      --bg-card-hover: #1a1a1e;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(255, 255, 255, 0.25);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-sub: #71717a;
      --accent-white: #ffffff;
      --accent-black: #000000;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 70%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.015) 0%, transparent 50%);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    /* HEADER & NAV */
    header.sticky-nav {
      position: sticky;
      top: 20px;
      z-index: 1000;
      margin-bottom: 50px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(18, 18, 21, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 12px;
      border-radius: 100px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: fit-content;
      margin: 0 auto;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 0.88em;
      font-weight: 500;
      transition: var(--transition);
    }

    nav a:hover {
      color: var(--accent-white);
      background: rgba(255, 255, 255, 0.08);
    }

    .admin-link {
      background: var(--accent-white) !important;
      color: var(--accent-black) !important;
      font-weight: 600 !important;
      margin-left: 4px;
    }

    .admin-link:hover {
      background: #e4e4e7 !important;
      transform: translateY(-1px);
    }

    /* HERO / PROFILE */
    .hero {
      text-align: center;
      margin-bottom: 70px;
      padding-top: 20px;
      animation: fadeIn 0.8s ease-out;
    }

    .profile-photo, .profile-photo-placeholder {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 0 auto 24px;
      border: 2px solid var(--border-color-hover);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
      transition: var(--transition);
    }

    .profile-photo {
      object-fit: cover;
      display: block;
    }

    .profile-photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3em;
      background: var(--bg-card);
      color: var(--text-muted);
    }

    .profile-photo:hover, .profile-photo-placeholder:hover {
      transform: scale(1.03);
      border-color: var(--accent-white);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.12);
    }

    h1 {
      font-size: 2.8em;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent-white);
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 1.15em;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .hero-bio {
      max-width: 620px;
      margin: 0 auto 24px;
      line-height: 1.7;
      color: var(--text-sub);
      font-size: 0.98em;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-links a {
      color: var(--text-muted);
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 0.85em;
      font-weight: 500;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .social-links a:hover {
      color: var(--accent-white);
      background: var(--bg-card-hover);
      border-color: var(--border-color-hover);
      transform: translateY(-2px);
    }

    /* SECTIONS GENERAL */
    section {
      margin-bottom: 80px;
      animation: fadeIn 1s ease-out;
    }

    .section-title {
      color: var(--accent-white);
      font-size: 1.6em;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 36px;
      position: relative;
      display: table;
      margin-left: auto;
      margin-right: auto;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: var(--accent-white);
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* SKILLS */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 32px;
      border-radius: var(--radius-lg);
    }

    .skill-item {
      display: flex;
      flex-direction: column;
    }

    .skill-name {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9em;
      color: var(--text-main);
    }

    .skill-bar-bg {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 100px;
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .skill-bar-fill {
      height: 100%;
      background: var(--accent-white);
      border-radius: 100px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* GALLERY */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      border-color: var(--border-color-hover);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .gallery-item img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      transition: var(--transition);
    }

    .gallery-item:hover img {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .gallery-caption {
      padding: 12px 14px;
      font-size: 0.85em;
      color: var(--text-muted);
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      font-weight: 500;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color-hover);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      animation: zoomIn 0.3s ease;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      color: var(--accent-white);
      font-size: 2.2em;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: var(--transition);
      opacity: 0.7;
    }

    .lightbox-close:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* CARDS (NEWS & PORTFOLIO) */
    .news-grid, .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    .news-card, .work-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .news-card:hover, .work-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-color-hover);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .news-image, .work-image {
      width: 100%;
      height: 200px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 2.5em;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .news-image img, .work-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .news-card:hover .news-image img,
    .work-card:hover .work-image img {
      transform: scale(1.05);
    }

    .news-content, .work-content {
      padding: 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .news-date {
      font-size: 0.78em;
      color: var(--text-sub);
      margin-bottom: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .news-title, .work-title {
      font-size: 1.18em;
      font-weight: 700;
      color: var(--accent-white);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .work-category {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 0.75em;
      font-weight: 600;
      margin-bottom: 12px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .news-summary, .work-description {
      color: var(--text-muted);
      font-size: 0.9em;
      line-height: 1.6;
      flex: 1;
      margin-bottom: 16px;
    }

    .work-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 500;
    }

    .news-link, .work-link {
      color: var(--accent-white);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      transition: var(--transition);
    }

    .news-link:hover, .work-link:hover {
      gap: 10px;
      opacity: 0.8;
    }

    /* STATE INDICATORS */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-sub);
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95em;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--accent-white);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    /* FOOTER */
    footer {
      text-align: center;
      color: var(--text-sub);
      padding: 40px 20px 20px;
      font-size: 0.85em;
      border-top: 1px solid var(--border-color);
      margin-top: 60px;
    }

    /* ANIMATIONS */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      h1 { font-size: 2.1em; }
      nav { gap: 4px; padding: 6px; }
      nav a { padding: 6px 12px; font-size: 0.8em; }
      .container { padding: 16px 16px 40px; }
      .news-grid, .portfolio-grid, .gallery-grid { grid-template-columns: 1fr; }
      .skills-grid { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="sticky-nav">
      <nav>
        <a href="#profile">Profil</a>
        <a href="#skills">Skill</a>
        <a href="#gallery">Galeri</a>
        <a href="#news">Berita</a>
        <a href="#portfolio">Portfolio</a>
        <a href="admin.html" class="admin-link">Admin &rarr;</a>
      </nav>
    </header>

    <section id="profile" class="hero">
      <div id="profilePhoto"><div class="profile-photo-placeholder"><i class="fa-regular fa-user"></i></div></div>
      <h1 id="profileName">Loading...</h1>
      <p class="hero-title" id="profileTitle"></p>
      <p class="hero-bio" id="profileBio"></p>
      <div class="social-links" id="socialLinks"></div>
    </section>

    <section id="skills">
      <h2 class="section-title">Keahlian</h2>
      <div id="skillsContent" class="loading"><div class="spinner"></div></div>
    </section>

    <section id="gallery">
      <h2 class="section-title">Galeri</h2>
      <div id="galleryContent" class="loading"><div class="spinner"></div></div>
    </section>

    <section id="news">
      <h2 class="section-title">Berita Utama</h2>
      <div id="newsContent" class="loading"><div class="spinner"></div></div>
    </section>

    <section id="portfolio">
      <h2 class="section-title">Portfolio Karya</h2>
      <div id="portfolioContent" class="loading"><div class="spinner"></div></div>
    </section>

    <footer>
      <p>&copy; 2026 Enzo Fahrezi. All rights reserved.</p>
    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    const API_BASE = '/api';

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ─── PROFILE ────────────────────────────────────────────────────────
    async function loadProfile() {
      try {
        const res = await fetch(`${API_BASE}/profile`);
        const p = await res.json();

        document.getElementById('profileName').textContent = p.name || 'Nama Belum Diatur';
        document.getElementById('profileTitle').textContent = p.title || '';
        document.getElementById('profileBio').textContent = p.bio || '';

        const photoDiv = document.getElementById('profilePhoto');
        photoDiv.innerHTML = p.photo
          ? `<img src="${p.photo}" class="profile-photo" alt="${escapeHtml(p.name)}">`
          : `<div class="profile-photo-placeholder"><i class="fa-regular fa-user"></i></div>`;

        const links = p.socialLinks || {};
        const linkIcons = { 
          instagram: '<i class="fa-brands fa-instagram"></i>', 
          tiktok: '<i class="fa-brands fa-tiktok"></i>', 
          github: '<i class="fa-brands fa-github"></i>', 
          linkedin: '<i class="fa-brands fa-linkedin-in"></i>' 
        };
        const linkLabels = { instagram: 'Instagram', tiktok: 'TikTok', github: 'GitHub', linkedin: 'LinkedIn' };
        
        const socialHtml = Object.entries(links)
          .filter(([, url]) => url)
          .map(([key, url]) => `<a href="${url}" target="_blank">${linkIcons[key] || '<i class="fa-solid fa-link"></i>'} ${linkLabels[key] || key}</a>`)
          .join('');
        document.getElementById('socialLinks').innerHTML = socialHtml;

        // Render skills from the same payload
        const skillsContent = document.getElementById('skillsContent');
        if (!p.skills || p.skills.length === 0) {
          skillsContent.innerHTML = '<p class="empty-state">Belum ada skill ditambahkan.</p>';
        } else {
          skillsContent.innerHTML = `<div class="skills-grid">${p.skills.map(s => `
            <div class="skill-item">
              <div class="skill-name"><span>${escapeHtml(s.name)}</span><span>${s.level || 0}%</span></div>
              <div class="skill-bar-bg"><div class="skill-bar-fill" style="width:${s.level || 0}%"></div></div>
            </div>
          `).join('')}</div>`;
        }
      } catch (err) {
        console.error('Error loading profile:', err);
        document.getElementById('profileName').textContent = 'Enzo Fahrezi';
        document.getElementById('skillsContent').innerHTML = '<p class="empty-state">Gagal memuat skill.</p>';
      }
    }

    // ─── GALLERY ────────────────────────────────────────────────────────
    async function loadGallery() {
      const content = document.getElementById('galleryContent');
      try {
        const res = await fetch(`${API_BASE}/gallery`);
        const data = await res.json();

        if (!data.photos || data.photos.length === 0) {
          content.innerHTML = '<p class="empty-state">Belum ada foto di galeri.</p>';
          return;
        }

        content.innerHTML = `<div class="gallery-grid">${data.photos.map(photo => `
          <div class="gallery-item" onclick="openLightbox('${photo.url}')">
            <img src="${photo.url}" alt="${escapeHtml(photo.caption || '')}" loading="lazy">
            ${photo.caption ? `<div class="gallery-caption">${escapeHtml(photo.caption)}</div>` : ''}
          </div>
        `).join('')}</div>`;
      } catch (err) {
        console.error('Error loading gallery:', err);
        content.innerHTML = '<p class="empty-state">Gagal memuat galeri.</p>';
      }
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    // ─── NEWS ───────────────────────────────────────────────────────────
    async function loadNews() {
      const content = document.getElementById('newsContent');
      try {
        const res = await fetch(`${API_BASE}/news`);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          content.innerHTML = '<p class="empty-state">Belum ada berita.</p>';
          return;
        }

        content.innerHTML = `<div class="news-grid">${data.items.map(item => {
          const date = item.createdAt ? new Date(item.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
          const imageHtml = item.image
            ? `<img src="${item.image}" alt="${escapeHtml(item.title)}">`
            : `<i class="fa-regular fa-newspaper"></i>`;
          const linkHtml = item.sourceUrl
            ? `<a href="${item.sourceUrl}" target="_blank" class="news-link">Baca selengkapnya <i class="fa-solid fa-arrow-right-long"></i></a>`
            : '';
          return `
            <div class="news-card">
              <div class="news-image">${imageHtml}</div>
              <div class="news-content">
                <div class="news-date">${date}</div>
                <div class="news-title">${escapeHtml(item.title)}</div>
                <div class="news-summary">${escapeHtml(item.summary || '')}</div>
                ${linkHtml}
              </div>
            </div>
          `;
        }).join('')}</div>`;
      } catch (err) {
        console.error('Error loading news:', err);
        content.innerHTML = '<p class="empty-state">Gagal memuat berita.</p>';
      }
    }

    // ─── PORTFOLIO ──────────────────────────────────────────────────────
    async function loadPortfolio() {
      const content = document.getElementById('portfolioContent');
      try {
        const res = await fetch(`${API_BASE}/portfolio`);
        const data = await res.json();

        if (!data.works || data.works.length === 0) {
          content.innerHTML = '<p class="empty-state">Belum ada karya yang ditampilkan.</p>';
          return;
        }

        content.innerHTML = `<div class="portfolio-grid">${data.works.map(work => {
          const imageHtml = work.image
            ? `<img src="${work.image}" alt="${escapeHtml(work.title)}">`
            : `<i class="fa-solid fa-folder-open"></i>`;
          const tagsHtml = (work.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
          const linkHtml = work.link ? `<a href="${work.link}" target="_blank" class="work-link">Lihat Proyek <i class="fa-solid fa-arrow-right-long"></i></a>` : '';
          return `
            <div class="work-card">
              <div class="work-image">${imageHtml}</div>
              <div class="work-content">
                <div class="work-title">${escapeHtml(work.title)}</div>
                <span class="work-category">${escapeHtml(work.category || 'Project')}</span>
                <div class="work-description">${escapeHtml(work.description || '')}</div>
                <div class="work-tags">${tagsHtml}</div>
                ${linkHtml}
              </div>
            </div>
          `;
        }).join('')}</div>`;
      } catch (err) {
        console.error('Error loading portfolio:', err);
        content.innerHTML = '<p class="empty-state">Terjadi kesalahan saat memuat portfolio.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadGallery();
      loadNews();
      loadPortfolio();
    });
  </script>
</body>
</html>
